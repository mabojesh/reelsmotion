<template>
  <!--
    Starter animation (10 s): hook → two lines → end card with the brand.
    Times live in T below; use the same numbers in plan/cues.json for the sound.
    Arabic: whole words only, dir="rtl" on every row of words (guides/arabic.md).
  -->
  <style>
    @font-face { font-family: "Display"; src: url("assets/fonts/display.ttf"); }
    @font-face { font-family: "Body"; src: url("assets/fonts/body.ttf"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Display", sans-serif; }
    .grid { position: absolute; inset: 0; opacity: .45;
      background-image: radial-gradient(rgba(0,0,0,.09) 2px, transparent 2.5px); background-size: 54px 54px; }
    .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; display: flex; flex-direction: column; justify-content: center; gap: 40px; padding: 0 70px; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 22px; text-align: center; }
    .w { display: inline-block; }
    .big .w { font-size: 112px; line-height: 1.3; }
    .mid .w { font-size: 80px; line-height: 1.45; }
    .small .w { font-family: "Body"; font-size: 46px; line-height: 1.5; color: var(--muted); }
    .hi { background: var(--ink); color: var(--bg); padding: 0 26px 10px; border-radius: 28px; }
    .card { align-self: center; background: var(--ink); color: var(--bg); border-radius: 44px; padding: 50px 70px 60px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .logo { width: 150px; height: 150px; border-radius: 50%; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 90px; line-height: 1; padding-bottom: 14px; }
    .name { font-size: 56px; line-height: 1.45; }
    .handle { font-family: "Body"; font-size: 40px; opacity: .7; direction: ltr; }
    .tag { font-family: "Body"; font-size: 40px; line-height: 1.5; }
  </style>

  <div id="root" data-composition-id="scenes" data-width="{{W}}" data-height="{{H}}">
    <div class="grid"></div>

    <div class="scene" id="s1">
      <div class="row big" dir="rtl"><span class="w">{{TITLE}}</span></div>
      <div class="row small" dir="rtl"><span class="w">جملة</span><span class="w">قصيرة</span><span class="w">تحت</span><span class="w">العنوان</span></div>
    </div>

    <div class="scene" id="s2">
      <div class="row mid" dir="rtl"><span class="w">فكرة</span><span class="w">وحدة</span><span class="w hi">بكل</span><span class="w">شاشة</span></div>
      <div class="row mid" dir="rtl"><span class="w">وكلمات</span><span class="w">كاملة</span><span class="w">بس</span></div>
    </div>

    <div class="scene" id="s3">
      <div class="card" dir="rtl">
        <div class="logo">{{LOGO}}</div>
        <div class="name">{{name}}</div>
        <div class="handle">{{handle}}</div>
        <div class="tag">{{tagline}}</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var T = { s1: 0, s2: 3.2, s3: 6.8, TOTAL: 10 };
      var tl = gsap.timeline({ paused: true });

      function scene(sel, a, b) {
        tl.set(sel, { visibility: "visible", opacity: 1 }, a);
        tl.set(sel, { visibility: "hidden", opacity: 0 }, b);
      }
      function popWords(sel, at, step) {
        tl.fromTo(sel, { opacity: 0, y: 40, scale: .92 },
          { opacity: 1, y: 0, scale: 1, duration: .35, ease: "back.out(1.6)", stagger: step }, at);
      }

      scene("#s1", T.s1, T.s2);
      // the title is already on screen at 0 s (frame 0 is the thumbnail), it just settles in
      tl.fromTo("#s1 .big .w", { scale: 1.15 }, { scale: 1, duration: .5, ease: "power3.out" }, 0);
      popWords("#s1 .small .w", 0.6, .07);
      tl.to("#s1 .row", { opacity: 0, y: -40, duration: .25, ease: "power2.in" }, T.s2 - .25);

      scene("#s2", T.s2, T.s3);
      popWords("#s2 .row:nth-child(1) .w", T.s2 + .05, .12);
      popWords("#s2 .row:nth-child(2) .w", T.s2 + .9, .12);
      tl.to("#s2 .row", { opacity: 0, y: -40, duration: .25, ease: "power2.in" }, T.s3 - .25);

      scene("#s3", T.s3, T.TOTAL + 1);
      tl.fromTo("#s3 .card", { opacity: 0, y: 80, scale: .94 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: "back.out(1.6)" }, T.s3 + .05);

      tl.to({}, { duration: .01 }, T.TOTAL - .01);
      window.__timelines = window.__timelines || {};
      window.__timelines["scenes"] = tl;
    })();
  </script>
</template>

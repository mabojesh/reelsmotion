<!doctype html>
<!-- reelsmotion still: carousel / cover. One .page per sheet (1080x1350 here).
     PNG per page:  python scripts/shoot.py carousel.html renders/page.png --size 1080x1350 --pages 3
     One PDF:       python scripts/shoot.py carousel.html renders/carousel.pdf --pdf -->
<html lang="ar"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Display"; src: url("assets/fonts/display.ttf"); }
@font-face { font-family: "Body"; src: url("assets/fonts/body.ttf"); }
:root { --bg: {{bg}}; --ink: {{ink}}; --muted: {{muted}}; --accent: {{accent}}; }
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); font-family: "Display", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { position: relative; width: 1080px; height: 1350px; overflow: hidden; page-break-after: always; display: flex; flex-direction: column; justify-content: center; padding: 0 90px; gap: 36px; direction: rtl; }
body.one .page { display: none; } body.one .page.on { display: flex; }
.h1 { font-size: 104px; line-height: 1.3; }
.h2 { font-size: 72px; line-height: 1.4; }
.p { font-family: "Body"; font-size: 46px; line-height: 1.6; color: var(--muted); }
.num { position: absolute; top: 70px; right: 90px; font-size: 34px; color: var(--muted); }
.next { position: absolute; bottom: 70px; left: 90px; font-size: 54px; }
.foot { position: absolute; bottom: 70px; right: 90px; font-family: "Body"; font-size: 32px; color: var(--muted); }
.foot b { font-family: "Display"; color: var(--ink); }
.card { background: var(--ink); color: var(--bg); border-radius: 40px; padding: 50px 60px 60px; }
</style></head>
<body>
<section class="page">
  <div class="h1">{{TITLE}}</div>
  <div class="p">سطر بيشرح الفكرة باختصار</div>
  <div class="foot"><b>{{name}}</b> · <span dir="ltr">{{handle}}</span></div>
  <div class="next">←</div>
</section>
<section class="page">
  <div class="num">٢</div>
  <div class="h2">فكرة وحدة بكل صفحة</div>
  <div class="p">جملة أو جملتين بس. خط كبير ومساحة فاضية.</div>
  <div class="next">←</div>
</section>
<section class="page">
  <div class="card">
    <div class="h2">{{name}}</div>
    <div class="p" style="color:inherit;opacity:.75"><span dir="ltr">{{handle}}</span></div>
    <div class="p" style="color:inherit">{{tagline}}</div>
  </div>
  <div class="h2">احفظ البوست وابعته لصاحبك</div>
</section>
<script>
  var m = location.hash.match(/^#p(\d+)$/);
  if (m) { document.body.className = "one"; var pg = document.querySelectorAll(".page")[+m[1] - 1]; if (pg) pg.classList.add("on"); }
</script>
</body></html>

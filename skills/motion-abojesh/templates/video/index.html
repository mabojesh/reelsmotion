<!doctype html>
<!-- motion_abojesh video: root composition. Size and length live here; the animation is in compositions/scenes.html.
     Change data-duration in BOTH places (#root and #scenes) and TOTAL in scenes.html together. -->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: {{bg}};
        --ink: {{ink}};
        --muted: {{muted}};
        --accent: {{accent}};
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-fps="30"
         data-width="{{W}}" data-height="{{H}}">
      <div id="scenes" data-composition-id="scenes" data-composition-src="compositions/scenes.html"
           data-start="0" data-duration="10" data-track-index="1" data-track-kind="graphics"
           data-width="{{W}}" data-height="{{H}}"></div>
      <!-- Sound: make assets/mix.wav with scripts/sfx.py, then uncomment.
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="10"
             data-track-index="2" data-volume="1"></audio>
      -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
